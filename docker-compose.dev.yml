name: razbor

services:
  postgres:
    image: postgres:16-alpine
    container_name: razbor-postgres
    environment:
      POSTGRES_USER: razbor
      POSTGRES_PASSWORD: razbor_dev
      POSTGRES_DB: razbor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razbor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: razbor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: razbor-dev
    ports:
      - "4000:4000"
      - "3000:3000"
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./apps/mini-app/src:/app/apps/mini-app/src
      - ./apps/mini-app/public:/app/apps/mini-app/public
      - ./apps/mini-app/index.html:/app/apps/mini-app/index.html
      - ./apps/mini-app/vite.config.ts:/app/apps/mini-app/vite.config.ts
      - ./packages/api/src:/app/packages/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/hooks/src:/app/packages/hooks/src
      - ./packages/graphql-client/src:/app/packages/graphql-client/src
      - ./packages/db/prisma:/app/packages/db/prisma
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://razbor:razbor_dev@postgres:5432/razbor
      REDIS_URL: redis://redis:6379
      PORT: 4000
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

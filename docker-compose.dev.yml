name: razbor

services:
  postgres:
    image: postgres:16-alpine
    container_name: razbor-postgres
    environment:
      POSTGRES_USER: razbor
      POSTGRES_PASSWORD: razbor_dev
      POSTGRES_DB: razbor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razbor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: razbor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: razbor-web
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    volumes:
      - .env.docker:/app/.env:ro
      - .env.docker:/app/packages/db/.env:ro
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/db/node_modules
      - /app/packages/api/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/graphql-client/node_modules
      - /app/packages/hooks/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

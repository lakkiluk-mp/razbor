name: razbor

services:
  postgres:
    image: postgres:16-alpine
    container_name: razbor-postgres
    environment:
      POSTGRES_USER: razbor
      POSTGRES_PASSWORD: razbor_dev
      POSTGRES_DB: razbor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razbor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: razbor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: razbor-server
    ports:
      - "4000:4000"
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./packages/api/src:/app/packages/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/prisma:/app/packages/db/prisma
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://razbor:razbor_dev@postgres:5432/razbor?connection_limit=30&pool_timeout=15
      REDIS_URL: redis://redis:6379
      PORT: 4000
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  mini-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: razbor-mini-app
    ports:
      - "3000:3000"
    command: ["pnpm", "dev:mini-app"]
    volumes:
      - ./apps/mini-app/src:/app/apps/mini-app/src
      - ./apps/mini-app/public:/app/apps/mini-app/public
      - ./apps/mini-app/index.html:/app/apps/mini-app/index.html
      - ./apps/mini-app/vite.config.ts:/app/apps/mini-app/vite.config.ts
      - ./packages/hooks/src:/app/packages/hooks/src
      - ./packages/graphql-client/src:/app/packages/graphql-client/src
      - ./packages/shared/src:/app/packages/shared/src
    env_file:
      - .env
    environment:
      PORT: 3000
      VITE_API_PROXY_TARGET: http://server:4000
    depends_on:
      server:
        condition: service_healthy

  listing-monitor:
    build:
      context: .
      dockerfile: apps/listing-monitor/Dockerfile
    container_name: razbor-listing-monitor
    ports:
      - "3001:3001"
    volumes:
      - ./apps/listing-monitor/src:/app/apps/listing-monitor/src
      - ./packages/db/prisma:/app/packages/db/prisma
      - ./packages/shared/src:/app/packages/shared/src
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://razbor:razbor_dev@postgres:5432/razbor
      REDIS_URL: redis://redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      MOBILE_PROXY_URL: ${MOBILE_PROXY_URL}
      MOBILE_PROXY_CHANGE_URL: ${MOBILE_PROXY_CHANGE_URL}
      SPFA_API_KEY: ${SPFA_API_KEY}
      ADMIN_PORT: ${ADMIN_PORT}
      LOG_LEVEL: debug
      NODE_ENV: development
      CRAWL_INTERVAL_MS: ${CRAWL_INTERVAL_MS:-300000}
      DEDUP_TTL_SECONDS: ${DEDUP_TTL_SECONDS:-604800}
      MAX_NOTIFICATIONS_PER_CYCLE: ${MAX_NOTIFICATIONS_PER_CYCLE:-20}
      REGION_CRAWL_ENABLED: ${REGION_CRAWL_ENABLED:-true}
      REGION_QUICK_CRAWL_INTERVAL_MS: ${REGION_QUICK_CRAWL_INTERVAL_MS:-300000}
      REGION_DEEP_CRAWL_CRON: ${REGION_DEEP_CRAWL_CRON:-0 22 * * *}
      REGION_DEEP_CRAWL_PAGES: ${REGION_DEEP_CRAWL_PAGES:-10}
      REGION_BRAND_BATCH_SIZE: ${REGION_BRAND_BATCH_SIZE:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:

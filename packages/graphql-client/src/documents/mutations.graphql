mutation Calculate($input: CalculateInput!) {
  calculate(input: $input) {
    totalPrice
    parts {
      part {
        id
        name
        category
        schematicZone {
          id
          code
          name
        }
        price {
          median
        }
      }
      included
      isDamaged
      price
    }
  }
}

mutation CreateSubscription($plan: SubscriptionPlan!) {
  createSubscription(plan: $plan) {
    confirmationToken
    subscriptionId
    paymentId
  }
}

mutation CancelSubscription {
  cancelSubscription {
    id
    status
    cancelAtPeriodEnd
    currentPeriodEnd
    daysRemaining
  }
}

mutation ResumeSubscription {
  resumeSubscription {
    id
    status
    cancelAtPeriodEnd
    currentPeriodEnd
    daysRemaining
  }
}

mutation RemovePaymentMethod($paymentMethodId: ID!) {
  removePaymentMethod(paymentMethodId: $paymentMethodId)
}

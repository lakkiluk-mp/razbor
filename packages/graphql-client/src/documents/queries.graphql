query GetBrands {
  brands {
    id
    name
    slug
    logo
  }
}

query GetBrand($slug: String!) {
  brand(slug: $slug) {
    id
    name
    slug
    logo
    models {
      id
      name
      slug
    }
  }
}

query GetModel($brandSlug: String!, $modelSlug: String!) {
  model(brandSlug: $brandSlug, modelSlug: $modelSlug) {
    id
    name
    slug
    brand {
      id
      name
      slug
    }
    generations {
      id
      name
      slug
      yearStart
      yearEnd
      bodyType
    }
  }
}

query GetGeneration($brandSlug: String!, $modelSlug: String!, $generationSlug: String!) {
  generation(brandSlug: $brandSlug, modelSlug: $modelSlug, generationSlug: $generationSlug) {
    id
    name
    slug
    yearStart
    yearEnd
    bodyType
    model {
      id
      name
      slug
      brand {
        id
        name
        slug
      }
    }
    parts {
      id
      name
      category
      schematicZone {
        id
        code
        name
        type
      }
      price {
        median
        min
        max
        count
      }
    }
  }
}

query GetSchematicZones($bodyType: BodyType!) {
  schematicZones(bodyType: $bodyType) {
    id
    code
    name
    type
  }
}

query GetUsageInfo {
  usageInfo {
    trialCredits
    subscriptionCredits
    totalCredits
    hasActiveSubscription
  }
}

query GetMe {
  me {
    id
    firstName
    lastName
    username
    isPremium
    totalCalculations
    trialCredits
    subscriptionCredits
    totalCredits
    subscription {
      id
      plan
      status
      credits
      creditsTotal
      currentPeriodEnd
      cancelAtPeriodEnd
      daysRemaining
    }
  }
}

query GetSubscriptionPlans {
  subscriptionPlans {
    plan
    price
    label
    days
    credits
  }
}

query GetMySubscription {
  mySubscription {
    id
    plan
    status
    credits
    creditsTotal
    currentPeriodStart
    currentPeriodEnd
    cancelAtPeriodEnd
    daysRemaining
  }
}

query GetMyPaymentMethods {
  myPaymentMethods {
    id
    cardLast4
    cardType
    expiryMonth
    expiryYear
    isDefault
  }
}

query GetGenerationById($id: String!) {
  generation: generationById(id: $id) {
    id
    name
    slug
    yearStart
    yearEnd
    bodyType
    model {
      id
      name
      slug
      brand {
        id
        name
        slug
      }
    }
    parts {
      id
      name
      category
      schematicZone {
        id
        code
        name
        type
      }
      price {
        median
        min
        max
        count
      }
    }
  }
}

query GetGenerationConfigs($generationId: ID!) {
  generationConfigs(generationId: $generationId) {
    engines {
      configGroup
      name
      price
    }
    transmissions {
      configGroup
      name
      price
    }
    drivetrains {
      configGroup
      name
      price
    }
  }
}

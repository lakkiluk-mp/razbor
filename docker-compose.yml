name: razbor

services:
  postgres:
    image: postgres:16-alpine
    container_name: razbor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - razbor-internal

  redis:
    image: redis:7-alpine
    container_name: razbor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - razbor-internal

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: razbor-server
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      MINI_APP_URL: ${MINI_APP_URL}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - razbor-internal

  razzbor:
    build:
      context: .
      dockerfile: Dockerfile.mini-app
      args:
        VITE_ALLOW_WEB_ACCESS: ${VITE_ALLOW_WEB_ACCESS:-false}
    container_name: razbor-mini-app
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - razbor-internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.razbor.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.razbor.entrypoints=websecure"
      - "traefik.http.routers.razbor.tls.certresolver=letsencrypt"
      - "traefik.http.services.razbor.loadbalancer.server.port=80"
      - "traefik.http.routers.razbor-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.razbor-http.entrypoints=web"
      - "traefik.http.routers.razbor-http.middlewares=razbor-redirect-https"
      - "traefik.http.middlewares.razbor-redirect-https.redirectscheme.scheme=https"

volumes:
  postgres_data:
  redis_data:

networks:
  razbor-internal:
    driver: bridge
  dokploy-network:
    external: true
